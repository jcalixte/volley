services:
  web:
    build: .
    # Coolify's own proxy owns :80 on the host and routes to this container, so
    # publishing a host port here would collide with it.
    expose:
      - "80"
    depends_on:
      - api

  api:
    build: ./backend
    expose:
      - "8000"
    # Failed-refresh log; must outlive the container across deploys.
    volumes:
      - incidents:/data

volumes:
  incidents:
