services:
  web:
    build: .
    # Coolify's own proxy owns :80 on the host and routes to this container, so
    # publishing a host port here would collide with it.
    expose:
      - "80"
    depends_on:
      - api

  api:
    build: ./backend
    expose:
      - "8000"
    # One line per failed FFVB refresh. Container logs die with the container,
    # and a deploy replaces it; this volume is what keeps an outage on record.
    volumes:
      - incidents:/data

volumes:
  incidents:
